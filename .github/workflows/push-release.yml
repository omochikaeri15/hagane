name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: "Hagane"

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      app_version: ${{ steps.get_version.outputs.version }}
      desktop: ${{ steps.builds.outputs.desktop }}
      website: ${{ steps.builds.outputs.website }}
      mobile: ${{ steps.builds.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from root Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep "^version" Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if tag exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Version $TAG already exists."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Version $TAG is new! Preparing release..."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Pick the front ends this release builds
        id: builds
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          for NAME in desktop website mobile; do
            if [ ! -f .github/release-builds ] && [ "$NAME" = desktop ]; then
              BUILD=true
            elif grep -q "^$NAME $VERSION " .github/release-builds 2>/dev/null; then
              BUILD=true
            else
              BUILD=false
            fi
            echo "$NAME=$BUILD" >> $GITHUB_OUTPUT
            echo "$NAME builds in v$VERSION: $BUILD"
          done

  build-windows:
    name: Build Windows (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.desktop == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - flavor: x64
    steps:
      - uses: actions/checkout@v5

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p desktop --release --verbose

      - name: Rename and Zip (Windows)
        run: |
          move target\release\desktop.exe "${{ env.BIN_NAME }}.exe"
          Compress-Archive -Path "${{ env.BIN_NAME }}.exe" -DestinationPath hagane-windows-${{ matrix.flavor }}.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.flavor }}-build
          path: hagane-windows-${{ matrix.flavor }}.zip
          retention-days: 1

  build-linux:
    name: Build Linux (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - flavor: x64
            runner: ubuntu-22.04
            asset: hagane-linux-x64.zip
          - flavor: arm
            runner: ubuntu-22.04-arm
            asset: hagane-linux-arm.zip
    steps:
      - uses: actions/checkout@v5

      - name: Install audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p desktop --release --verbose

      - name: Prepare and Zip (Linux)
        run: |
          mv target/release/desktop "${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
          zip "${{ matrix.asset }}" "${{ env.BIN_NAME }}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.flavor }}-build
          path: ${{ matrix.asset }}
          retention-days: 1

  build-macos:
    name: Build MacOS (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.desktop == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - flavor: arm
            target: aarch64-apple-darwin
          - flavor: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p desktop --release --verbose --target ${{ matrix.target }}

      - name: Prepare and Zip (Mac)
        run: |
          mv "target/${{ matrix.target }}/release/desktop" "${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
          zip "hagane-mac-${{ matrix.flavor }}.zip" "${{ env.BIN_NAME }}"

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.flavor }}-build
          path: hagane-mac-${{ matrix.flavor }}.zip
          retention-days: 1

  build-website:
    name: Build Website (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.website == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: wasm
    steps:
      - uses: actions/checkout@v5

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-website-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install the Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --locked --no-confirm

      - name: Clear the previous website bundle
        run: rm -rf target/dx/website/release/web/public

      - name: Build Website (release)
        working-directory: crates/website
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: dx build --release

      - name: Zip the WASM
        run: |
          WASM=$(find target/dx/website/release/web/public -name '*.wasm' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$WASM" ]; then
            echo "The website build produced no .wasm file"
            exit 1
          fi
          mkdir -p wasm-bundle
          cp "$WASM" "wasm-bundle/${{ env.BIN_NAME }}.wasm"
          (cd wasm-bundle && zip ../hagane-website-wasm.zip "${{ env.BIN_NAME }}.wasm")

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-wasm-build
          path: hagane-website-wasm.zip
          retention-days: 1

      - name: Add the Pages headers file
        run: cp crates/website/_headers target/dx/website/release/web/public/_headers

      - name: Upload Website Bundle
        uses: actions/upload-artifact@v4
        with:
          name: website-site
          path: target/dx/website/release/web/public
          retention-days: 1

  build-mobile:
    name: Build Mobile (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.mobile == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - flavor: apk
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mobile-${{ matrix.flavor }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Java
        if: matrix.flavor == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        if: matrix.flavor == 'apk'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 platform-tools"

      - name: Add Android targets
        if: matrix.flavor == 'apk'
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-binstall
        if: matrix.flavor == 'apk'
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-apk
        if: matrix.flavor == 'apk'
        run: cargo binstall cargo-apk --locked --no-confirm

      - name: Restore the release keystore
        if: matrix.flavor == 'apk'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be set; a release signed with a throwaway key cannot update an installed one."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" > /dev/null

      - name: Build the APK
        if: matrix.flavor == 'apk'
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: cargo apk build --release -p mobile --lib

      - name: Zip the APK
        if: matrix.flavor == 'apk'
        run: |
          mkdir -p apk-bundle
          cp target/release/apk/hagane.apk "apk-bundle/${{ env.BIN_NAME }}.apk"
          (cd apk-bundle && zip ../hagane-android-apk.zip "${{ env.BIN_NAME }}.apk")

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.flavor }}-build
          path: hagane-android-apk.zip
          retention-days: 1

  create-release:
    name: Publish Release
    needs: [check-version, build-windows, build-linux, build-macos, build-website, build-mobile]
    if: ${{ !cancelled() && needs.check-version.outputs.should_release == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        if: needs.check-version.outputs.desktop == 'true' || needs.check-version.outputs.website == 'true' || needs.check-version.outputs.mobile == 'true'

      - name: List artifacts (Verification)
        run: ls -R

      - name: Deploy Website to Cloudflare Pages
        if: needs.check-version.outputs.website == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website-site --project-name=hagane --branch=main --commit-dirty=true

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          ASSETS=()
          if [ "${{ needs.check-version.outputs.desktop }}" = true ]; then
            ASSETS+=(
              windows-x64-build/hagane-windows-x64.zip
              linux-x64-build/hagane-linux-x64.zip
              linux-arm-build/hagane-linux-arm.zip
              mac-arm-build/hagane-mac-arm.zip
              mac-x64-build/hagane-mac-x64.zip
            )
          fi
          if [ "${{ needs.check-version.outputs.website }}" = true ]; then
            ASSETS+=(website-wasm-build/hagane-website-wasm.zip)
          fi
          if [ "${{ needs.check-version.outputs.mobile }}" = true ]; then
            ASSETS+=(
              mobile-apk-build/hagane-android-apk.zip
            )
          fi
          gh release create "v${{ needs.check-version.outputs.app_version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.check-version.outputs.app_version }}" \
            --notes-file CHANGELOG.md \
            "${ASSETS[@]}"
