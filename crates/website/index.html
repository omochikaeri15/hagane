<!DOCTYPE html>
<html>
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://hagane.cloud" crossorigin>
        <style>html,body{margin:0;height:100%;background:#212121}html.starting-light,html.starting-light body{background:#f5f5f5}#main{visibility:hidden}</style>
        <script>try{if(localStorage.getItem("theme")==="light"){document.documentElement.classList.add("starting-light")}}catch(e){}setTimeout(function(){var main=document.getElementById("main");if(main){main.style.visibility="visible"}},8000)</script>
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
