[package]
name = "mobile"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mobile"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mobile"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
codex = { workspace = true, features = ["graphics", "pack"] }
emulator = { path = "../emulator" }
foundry = { path = "../foundry", default-features = false, features = ["disk", "source", "import", "mods", "export", "statblock", "sandbox"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "backend-android-activity-06"] }
image = { version = "0.25.10", default-features = false, features = ["png", "rayon"] }
rayon = "1.12"
bytemuck = "1"
glow = "0.18"
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-skia", "raw-window-handle-06"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSObject", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIDocumentPickerViewController", "UIResponder", "UIView", "UIViewController", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
raw-window-handle = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5.4.1"

[build-dependencies]
slint-build = "1.18"

[package.metadata.android]
package = "app.omochikaeri.hagane"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"
apk_name = "hagane"
strip = "strip"

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "bcc-mobile"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Hagane"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboard|keyboardHidden|navigation|touchscreen|screenSize|smallestScreenSize|screenLayout|uiMode|density|fontScale|locale|layoutDirection"
launch_mode = "singleTask"
exported = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"
